name: Other bug (display, audio, installation or controls)
description: Report a problem other than a connection failure or disconnection.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        For USB/Bluetooth/Wi-Fi connection failures, getting stuck opening CarPlay, reconnect loops, disconnects or connection-dependent stutter, use the [Connection problem form](https://github.com/uJZk/TiPlay/issues/new?template=connection.yml). Connection reports require diagnostic logs.

        Test while parked. Reports are public: review diagnostic files and remove personal information before attaching them. Never post credentials.
  - type: input
    id: version
    attributes: {label: TiPlay version, placeholder: 'Exact APK version from About'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: Car and browser, placeholder: 'Car model/year, browser and vehicle firmware versions'}
    validations: {required: true}
  - type: input
    id: android
    attributes: {label: Android phone and system version, placeholder: 'Phone model, Android version and exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [Wireless, USB, Both, 'Other / unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: 'Include expected behavior, steps, relevant settings and the approximate failure time. Include Android hotspot or Existing Wi-Fi, and band/channel if shown. For Existing Wi-Fi, include the router model and whether client isolation is enabled.'
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report or recording
      description: 'Reproduce on the latest official release, then Advanced settings → Save diagnostic report. Reports normally save to Downloads/TiPlay. If public storage is unavailable, use View or Share for the app-owned copy shown in the confirmation. Review the text before attaching it and never include your hotspot password. Include the approximate failure time. For installation failures, attach the installer error and Android/API version; an in-app report may not be available.'
