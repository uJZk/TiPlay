name: Connection problem (logs required)
description: USB/Bluetooth/Wi-Fi failures, stuck opening CarPlay, disconnects, reconnect loops or connection-dependent stutter.
title: '[Connection] '
body:
  - type: markdown
    attributes:
      value: |
        We need diagnostic logs from the affected device to investigate connection problems. Reports without logs will be closed pending logs; you are welcome to reopen the issue after providing them. If GitHub does not offer a Reopen button, add the logs in a comment and ask a maintainer to reopen it.

        While parked, reproduce the problem on the [latest official release](https://github.com/uJZk/TiPlay/releases), then open **Advanced settings → Save diagnostic report**. Capture the first connection attempt through the failure.

        Reports normally save to **Downloads/TiPlay**. If public storage is unavailable, TiPlay saves an app-owned copy; use **View** or **Share** in the confirmation. If TiPlay crashes, reopen it and export the report; include Android crash logs if available.

        Reports are public. Review the file and remove personal information and credentials, including hotspot passwords, before uploading. Screenshots or videos may help, but do not replace diagnostic logs. [Detailed export instructions](https://github.com/uJZk/TiPlay/blob/main/docs/Diagnostics.md).
  - type: input
    id: version
    attributes: {label: TiPlay version, placeholder: 'Exact APK version from About'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: Car and browser, placeholder: 'Car model/year, browser and vehicle firmware versions'}
    validations: {required: true}
  - type: input
    id: android
    attributes: {label: Android phone and system version, placeholder: 'Phone model, Android version and exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [Wireless, USB, Both, 'Other / unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: 'Include expected behavior, steps, relevant settings and the last connection message. Include whether the phone and car browser use Android hotspot or Existing Wi-Fi, the band/channel if shown, and whether client isolation is enabled. For USB, describe any permission prompts. If multiple modes fail, identify the mode used for each log.'
    validations: {required: true}
  - type: input
    id: failure-time
    attributes:
      label: Approximate failure time
      description: 'Give the time shown on the device so we can find the failure in the logs.'
      placeholder: 'Example: 14:35, device local time'
    validations: {required: true}
  - type: upload
    id: diagnostics
    attributes:
      label: Diagnostic logs
      description: 'Attach the full TiPlay diagnostic report (.txt or .log), or a .zip containing the logs. Wait until the upload finishes before submitting. If you used View, copy the complete text into a .txt file and attach it here.'
    validations:
      required: true
      accept: '.txt,.log,.zip'
  - type: textarea
    id: extra-context
    attributes:
      label: Additional context or screenshots
      description: 'Optional screenshots, recordings, workarounds or comparisons with another connection mode.'
