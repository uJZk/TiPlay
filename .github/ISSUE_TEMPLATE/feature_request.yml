name: Feature request or general question
description: Suggest a TiPlay feature or ask a question that is not a bug report.
body:
  - type: markdown
    attributes:
      value: |
        TiPlay connects an Android phone to a car browser. Describe the goal you want to achieve with that setup.

        For connection failures or disconnects, use the [Connection problem form](https://github.com/uJZk/TiPlay/issues/new?template=connection.yml) and attach diagnostic logs. For other bugs, use the [Other bug form](https://github.com/uJZk/TiPlay/issues/new?template=bug.yml).
  - type: textarea
    id: request
    attributes:
      label: Feature request or question
      description: 'Describe what you would like to do and how it would help.'
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Device information and additional context
      description: 'If relevant, include the Android phone model/system version, car model/year and browser/firmware version, TiPlay APK version, and iPhone/iOS version.'
