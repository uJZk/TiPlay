name: Experimental source-rate queue Android proof

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful x86_64 native build run ID
        required: true
        type: string
      native_head_sha:
        description: Expected immutable native build commit SHA
        required: true
        type: string
      native_aar_sha256:
        description: Independently recorded SHA-256 of that run's AAR
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  android-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROOF_RUN_ID: ${{ inputs.native_run_id }}
      PROOF_HEAD_SHA: ${{ inputs.native_head_sha }}
      PROOF_AAR_SHA: ${{ inputs.native_aar_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check proof workflow job expression contexts
        run: |
          python3 tests/native/test_proof_workflow_contexts.py
          python3 tests/native/test_synthetic_probe_tail.py
          python3 tests/native/test_video_probe.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Ensure FFmpeg fixture tools on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo 'FFmpeg or ffprobe is missing; installing ffmpeg on the disposable hosted runner.'
            sudo apt-get update -qq || { echo 'Failed to update hosted runner package index.' >&2; exit 1; }
            sudo apt-get install -y --no-install-recommends ffmpeg || { echo 'Failed to install FFmpeg on the hosted runner.' >&2; exit 1; }
          fi
          for tool in ffmpeg ffprobe; do
            if ! command -v "$tool"; then echo "Required fixture tool is unavailable: $tool" >&2; exit 1; fi
          done
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/tiplay-ffmpeg-encoders.txt" 2>&1
          if ! grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' "$RUNNER_TEMP/tiplay-ffmpeg-encoders.txt"; then
            echo 'Hosted runner FFmpeg lacks the required libx264 encoder.' >&2
            exit 1
          fi
      - name: Validate native run identity and download its artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROOF_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROOF_AAR_SHA" =~ ^[0-9a-f]{64}$ ]]
          root="$RUNNER_TEMP/tiplay-proof-input"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID" > "$root/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID/artifacts?per_page=100" > "$root/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$PROOF_HEAD_SHA" > "$root/commit.json"
          tree_sha=$(python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          commit = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tiplay-proof-input/commit.json').read_text())
          assert commit['sha'] == os.environ['PROOF_HEAD_SHA']
          tree_sha = commit['tree']['sha']
          assert re.fullmatch(r'[0-9a-f]{40}', tree_sha)
          print(tree_sha)
          PY
          )
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$tree_sha?recursive=1" > "$root/tree.json"
          python3 tests/native/verify_producer_tree.py --tree "$root/tree.json"
          artifact_id=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tiplay-proof-input'
          run = json.loads((root / 'run.json').read_text())
          items = json.loads((root / 'artifacts.json').read_text())['artifacts']
          assert run['id'] == int(os.environ['PROOF_RUN_ID'])
          assert run['head_sha'] == os.environ['PROOF_HEAD_SHA']
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success'
          assert run['path'].split('@')[0] == '.github/workflows/android-release.yml'
          matching = [a for a in items if a['name'] == 'tiplay-source-rate-x86_64' and not a['expired']]
          assert len(matching) == 1 and isinstance(matching[0]['id'], int)
          print(matching[0]['id'])
          PY
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$root/artifact.zip"
          python3 tests/native/verify_proof_artifact.py \
            --run "$root/run.json" --artifacts "$root/artifacts.json" --tree "$root/tree.json" --archive "$root/artifact.zip" \
            --output "$root/validated" --run-id "$PROOF_RUN_ID" --head-sha "$PROOF_HEAD_SHA" \
            --aar-sha "$PROOF_AAR_SHA" --patch scripts/webrtc/source-rate-video.patch
      - name: Compile actual product classes and create High fixture
        shell: bash
        run: |
          set -euo pipefail
          # Isolated proof checkout only. Bind the Android candidate to the exact
          # validated experimental AAR; never mutate the production checkout.
          git apply scripts/webrtc/source-rate-android-experiment.patch
          mkdir -p shared/libs/webrtc-source-rate
          cp "$RUNNER_TEMP/tiplay-proof-input/validated/tiplay-source-rate.aar" shared/libs/webrtc-source-rate/webrtc-source-rate.aar
          printf '%s  webrtc-source-rate.aar\n' "$PROOF_AAR_SHA" > shared/libs/webrtc-source-rate/SHA256SUMS
          ./gradlew :shared:compileDebugKotlin --no-daemon --max-workers=1 --no-parallel \
            --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -I gradle/ci-memory.init.gradle
          fixture="$RUNNER_TEMP/tiplay-high.h264"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1568x1080:rate=60 \
            -frames:v 180 -an -c:v libx264 -profile:v high -level:v 4.2 -pix_fmt yuv420p \
            -preset veryfast -tune zerolatency -bf 0 \
            -b:v 10M -minrate 10M -maxrate 10M -bufsize 10M \
            -x264-params 'aud=1:keyint=60:min-keyint=60:scenecut=0:repeat-headers=1:threads=2:nal-hrd=cbr' \
            -f h264 "$fixture"
          python3 tests/native/verify_high_proof_sdp.py --fixture "$fixture"
          # Negative controls observe branch activation, not high-rate capacity.
          # Keep genuine High/SPS/dimensions/cadence with a smaller source stream.
          control_fixture="$RUNNER_TEMP/tiplay-high-control.h264"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1568x1080:rate=60 \
            -frames:v 180 -an -c:v libx264 -profile:v high -level:v 4.2 -pix_fmt yuv420p \
            -preset veryfast -tune zerolatency -bf 0 \
            -b:v 200k -minrate 200k -maxrate 200k -bufsize 200k \
            -x264-params 'aud=1:keyint=60:min-keyint=60:scenecut=0:repeat-headers=1:threads=2:nal-hrd=cbr' \
            -f h264 "$control_fixture"
          python3 tests/native/verify_high_proof_sdp.py --fixture "$control_fixture" --max-average-bitrate 300000
      - name: Start accelerated headless Android emulator
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/tiplay-avd
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then echo 'Infrastructure unavailable: /dev/kvm is missing.' >&2; exit 1; fi
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n tiplay-proof \
            -k 'system-images;android-35;google_apis;x86_64'
          nohup "$ANDROID_HOME/emulator/emulator" -avd tiplay-proof -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/tiplay-emulator.log" 2>&1 &
          timeout 300 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          booted=0
          for attempt in $(seq 1 150); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" != 1 ]; then echo 'Infrastructure unavailable: emulator did not boot.' >&2; exit 1; fi
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Run TEST ONLY forced-overload sender proof
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'tiplay::QueueLimit{0, 0} /* TEST ONLY: forced overload */' scripts/webrtc/source-rate-video.patch
          root="$RUNNER_TEMP/tiplay-proof"
          aar="$RUNNER_TEMP/tiplay-proof-input/validated/tiplay-source-rate.aar"
          fixture="$RUNNER_TEMP/tiplay-high.h264"
          python3 scripts/webrtc/make_overload_probe.py tests/native/NativeVideoProbe.java "$RUNNER_TEMP/NativeVideoProbe.java"
          cp "$RUNNER_TEMP/NativeVideoProbe.java" tests/native/NativeVideoProbe.java
          python3 tests/native/rtc-video-probe.py build --work-dir "$root/custom" --webrtc-aar "$aar" --abi x86_64 --fixture "$fixture"
          adb shell mkdir -p /data/local/tmp/tiplay-native-probe
          adb push "$root/custom/probe.jar" "$root/custom/fixture.h264" "$root/custom/libjingle_peerconnection_so.so" /data/local/tmp/tiplay-native-probe/
          adb shell 'CLASSPATH=/data/local/tmp/tiplay-native-probe/probe.jar app_process /system/bin com.shilapi.xcertplay.web.NativeVideoProbe bundle 0 0 180 warm info source-rate queue-epoch' > "$root/overload.log" 2>&1 || { tail -n 120 "$root/overload.log"; exit 1; }
          python3 scripts/webrtc/verify_overload_evidence.py "$root/overload.log" "$root/overload.json"
      - name: Upload bounded synthetic probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tiplay-native-emulator-proof
          path: |
            ${{ runner.temp }}/tiplay-proof/**/*.json
            ${{ runner.temp }}/tiplay-proof/**/*.log
            ${{ runner.temp }}/tiplay-emulator.log
          if-no-files-found: ignore
          retention-days: 3
