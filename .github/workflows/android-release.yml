name: Targeted Android tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Focused trust, video recovery and diagnostic dialog tests
        run: >-
          ./gradlew :shared:testDebugUnitTest
          --tests '*ReceiverMirrorStartupTest' --tests '*ReceiverDeviceTrustTest' --tests '*ReceiverServerTest'
          --tests '*ReceiverProtocolDiagnosticsTest' --tests '*RtspMessageUtf8Test'
          --tests '*AndroidBluetoothVoiceChannelTest' --tests '*CarBluetoothAudioSessionTest' --tests '*BrowserRtcSourceRateGuardTest' --tests '*BrowserRtcVideoFlowTest' --tests '*BrowserRtcVideoTransactionTest' --tests '*BrowserRtcVideoTrackTest' --tests '*AirPlayVideoPlaybackTest'
          :common:testDebugUnitTest --tests '*CarBluetoothPermissionRecoveryTest' --tests '*BrowserMainHostTest' --tests '*CarBluetoothStatusTest' --tests '*CarBluetoothSessionControllerTest' --tests '*CarBluetoothSelectionStateTest' --tests '*BrowserMainPageTest' --tests '*SettingsTranslationsTest' --tests '*DiagnosticLogDialogTest' --tests '*DiagnosticLogActionsTest'
          --continue --stacktrace --no-daemon --max-workers=1 --no-parallel --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -I gradle/ci-memory.init.gradle

      - name: Save targeted test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
          if-no-files-found: ignore

