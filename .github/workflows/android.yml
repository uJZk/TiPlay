name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned NetEq source materialization
        run: python3 -m unittest discover -s tests -p 'test_neteq_sources.py'
      - name: Install pinned build tools
        run: python3 -m pip install cmake==4.1.2 ninja==1.13.0
      - name: Verify pinned WASI SDK and Binaryen
        run: python3 scripts/soxr/prepare-toolchain.py work/wasm-toolchain
      - name: Reproduce shipped WASM libraries
        run: >-
          python3 scripts/build_wasm.py --check
          --sdk work/wasm-toolchain/wasi-sdk-34.0-x86_64-linux
          --binaryen work/wasm-toolchain/package
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser page unit tests
        run: node --test tests/web/*.test.mjs
      - name: Browser offline runtime manifest
        run: python3 scripts/update_browser_cache.py --check
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Release draft delivery tests
        run: python3 -m unittest discover -s tests -p 'test_release_draft.py'
      - name: Verify root site deployment layout
        run: python3 -m unittest discover -s tests -p 'test_site_deployment.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Native symbol identity and private archive contracts
        run: python3 -m unittest discover -s tests -p 'test_native_symbols.py'
      - name: Unit tests, lint and source-only debug build
        run: >-
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest
          :mobile:lintDebug :home:lintDebug :maphost:lintDebug
          :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug
          --stacktrace --no-daemon --max-workers=1 --no-parallel --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -I gradle/ci-memory.init.gradle
      - name: Native libsoxr source, JNI and streaming DSP checks
        run: python3 scripts/test_soxr_native.py
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
