name: Native encoded audio transport

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build Android binaries or run the focused native/browser interoperability proof
        type: choice
        default: android-binaries
        options:
          - android-binaries
          - host-interop

permissions:
  contents: read

concurrency:
  group: native-rtc-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: ${{ inputs.mode != 'host-interop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check native symbol pairing and draft-only archive contracts
        run: python3 -m unittest discover -s tests -p 'test_native_symbols.py'
      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.2.13676358 cmake;3.31.6
      - name: Build the pinned transport and retain matching line symbols
        run: |
          python3 scripts/rtc-audio/build.py \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --cmake "$ANDROID_HOME/cmake/3.31.6/bin/cmake" \
            --ninja "$ANDROID_HOME/cmake/3.31.6/bin/ninja" \
            --work-dir "$RUNNER_TEMP/tiplay-rtc-audio" \
            --symbols-dir "$RUNNER_TEMP/tiplay-audio-symbols"
          python3 scripts/rtc-audio/build.py --verify
          python3 scripts/native_symbols.py verify "$RUNNER_TEMP/tiplay-audio-symbols"
      - uses: actions/upload-artifact@v4
        with:
          name: tiplay-audio-symbols
          path: ${{ runner.temp }}/tiplay-audio-symbols/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: tiplay-encoded-audio
          path: |
            shared/src/main/jni/rtc-audio/prebuilt/
            shared/src/main/jni/rtc-audio/artifacts.json
            shared/src/main/jni/rtc-audio/sources.lock.json
          if-no-files-found: error
          retention-days: 90

  host-interop:
    if: ${{ inputs.mode == 'host-interop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Check focused interoperability harness contracts
        run: python3 tests/native/test_audio_interop_workflow.py
      - name: Compile the actual shared Kotlin classes without assembling an APK
        run: >-
          ./gradlew :shared:compileDebugKotlin --no-daemon --max-workers=1 --no-parallel
          --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          -I gradle/ci-memory.init.gradle
      - name: Build the pinned host JNI transport
        run: |
          python3 -m pip install cmake==4.1.2 ninja==1.13.0
          python3 scripts/rtc-audio/build.py --host --jobs 2 --work-dir "$RUNNER_TEMP/tiplay-rtc-audio"
          printf 'RTC_AUDIO_HOST_DIR=%s\n' "$RUNNER_TEMP/tiplay-rtc-audio/build/host" >> "$GITHUB_ENV"
      - name: Install a pinned default Chromium test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/tiplay-interop-pw" --no-audit --no-fund playwright-core@1.62.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/tiplay-interop-browsers"
          node "$RUNNER_TEMP/tiplay-interop-pw/node_modules/playwright-core/cli.js" install --with-deps chromium
          printf 'NODE_PATH=%s\n' "$RUNNER_TEMP/tiplay-interop-pw/node_modules" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/tiplay-interop-pw/node_modules" node -e \
            'console.log("CHROMIUM=" + require("playwright-core").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify original Opus, Worklet output and seventeen source owners
        env:
          RTC_AUDIO_INTEROP_OUTPUT: ${{ runner.temp }}/tiplay-audio-interop/baseline.json
        run: node tests/web-e2e/rtc-audio-native.mjs
      - name: Verify original encoded Opus bytes with a separate transparent receive tap
        env:
          RTC_AUDIO_INTEROP_OUTPUT: ${{ runner.temp }}/tiplay-audio-interop/encoded-payloads.json
        run: node tests/web-e2e/rtc-audio-native.mjs --encoded-tap
      - name: Verify a local UDP blackhole fails without fallback
        env:
          RTC_AUDIO_INTEROP_OUTPUT: ${{ runner.temp }}/tiplay-audio-interop/udp-blackhole.json
        run: node tests/web-e2e/rtc-audio-native.mjs --fault=udp-blackhole
      - name: Verify wrong ICE credentials fail without fallback
        env:
          RTC_AUDIO_INTEROP_OUTPUT: ${{ runner.temp }}/tiplay-audio-interop/wrong-ice-password.json
        run: node tests/web-e2e/rtc-audio-native.mjs --fault=wrong-ice-password
      - name: Upload bounded synthetic interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiplay-native-audio-interop
          path: ${{ runner.temp }}/tiplay-audio-interop/*.json
          if-no-files-found: warn
          retention-days: 3

  symbols:
    # Forks/non-main refs retain artifacts only, never durable releases in TiPlay.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'uJZk/TiPlay' }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tiplay-audio-symbols
          path: native-symbols
      - name: Retain immutable symbols in an authenticated draft only
        run: python3 scripts/archive_native_symbols.py native-symbols
