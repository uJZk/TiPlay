name: Publish site
# Publish the authenticated WebRTC product at the root and release-index download pages under download/.
on:
  push:
    branches: [main]
    paths: ['gradle.properties', 'site/**', 'scripts/build_site.py', 'scripts/assemble_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Current deployment: https://ujzk.github.io/TiPlay/ with SITE_BASE_URL configured in the repository.
      # The site's public address. For a custom domain, set the repository variable SITE_BASE_URL (Settings → Secrets
      # and variables → Actions → Variables), for example https://tiplay.example/. Unset: https://ujzk.github.io/TiPlay/.
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate the product version and download pages
        run: python3 scripts/build_site.py
      - name: Verify root layout and public assets
        run: |
          python3 scripts/update_browser_cache.py --check
          python3 -m unittest discover -s tests -p 'test_site_deployment.py'
      - name: Assemble the single production site
        run: python3 scripts/assemble_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
