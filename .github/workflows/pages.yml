name: Publish site
# Keep the stable HTTP site and publish the current WebRTC beta at /webrtc/.
on:
  push:
    branches: [main]
    paths: ['gradle.properties', 'site/**', 'scripts/build_site.py', 'scripts/assemble_site.py', 'scripts/assemble_beta_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Current deployment: https://ujzk.github.io/TiPlay/ with SITE_BASE_URL configured in the repository.
      # The site's public address. For a custom domain, set the repository variable SITE_BASE_URL (Settings → Secrets
      # and variables → Actions → Variables), for example https://tiplay.example/. Unset: https://ujzk.github.io/TiPlay/.
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Preserve this layout on main and on future repair branches until promotion.
      - name: Assemble stable site and isolated WebRTC beta
        run: python3 scripts/assemble_beta_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
