name: Restore pinned native producer symbols
on: workflow_dispatch
permissions: {}
jobs:
  restore:
    if: github.repository == 'uJZk/TiPlay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: '41382204134'
            artifact: tiplay-source-rate-all
            directory: retained/native-symbols
            digest: 4bb8b7c670f6a326d8907674598e238ae395a99705595991d95121b88bfb5b8c
          - run: '43578453616'
            artifact: tiplay-audio-symbols
            directory: retained
            digest: aede91e938843678befb75915d3ed37b1345bf5fe7c00086e752bbee5fadb879
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run }}
          name: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: retained
      - name: Verify producer identity and restore private draft
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOLS: ${{ matrix.directory }}
          INDEX_SHA256: ${{ matrix.digest }}
        run: |
          for delay in 0 5 15 30 60; do
            sleep "$delay"
            if python3 scripts/archive_native_symbols.py "$SYMBOLS" --restore-digest "$INDEX_SHA256"; then
              exit 0
            fi
          done
          exit 1
