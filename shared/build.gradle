plugins {
    id 'com.android.library'
}

// Do not silently build against a different native transport binary.
def sourceRateWebRtcAar = rootProject.file('shared/libs/webrtc-source-rate/webrtc-source-rate.aar')
def sourceRateWebRtcSha = rootProject.file('shared/libs/webrtc-source-rate/SHA256SUMS')
def verifySourceRateWebRtc = tasks.register('verifySourceRateWebRtc') {
    inputs.file(sourceRateWebRtcAar)
    inputs.file(sourceRateWebRtcSha)
    doLast {
        def checksum = sourceRateWebRtcSha.text.trim()
        if (!(checksum ==~ /[0-9a-f]{64}  webrtc-source-rate\.aar/)) {
            throw new GradleException('Invalid source-rate WebRTC checksum manifest')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        sourceRateWebRtcAar.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            for (int n = stream.read(buffer); n != -1; n = stream.read(buffer)) digest.update(buffer, 0, n)
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != checksum.substring(0, 64)) {
            throw new GradleException('Unexpected source-rate WebRTC AAR SHA-256')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(verifySourceRateWebRtc) }

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 25
        consumerProguardFiles 'ambient-consumer-rules.pro'
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-25'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    buildFeatures {
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    testOptions {
        // Full protocol/resource tests include Robolectric sandboxes and 32 MiB boundary fixtures.
        // Keep the suite from exhausting Gradle's 512 MiB default test-worker heap.
        unitTests.all { maxHeapSize = '2g' }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.ujzk.vendor:geocoordinates:0.14.2@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    // Source-rate WebRTC M150; the local AAR supplies the sole org.webrtc/JNI copy.
    implementation 'com.ujzk.vendor:webrtc-source-rate:150.7871.01@aar'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    // TiPlay: the Shizuku hotspot address method (docs/Hotspot-address.md).
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    // Android AAR packages all supported ABIs; JVM tests load the matching desktop JNI library.
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    testImplementation 'com.github.luben:zstd-jni:1.5.7-4'
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
