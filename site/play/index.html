<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121c">
<meta name="referrer" content="no-referrer">
<!-- CSP host sources cannot express IP ranges, so connect-src allows the driver's HTTP phone address. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http: https:; media-src 'self' http: https: blob:; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TiPlay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reconnect.css">
<link rel="stylesheet" href="airplay-controls.css">
<link rel="stylesheet" href="airplay-trust.css">
<link rel="stylesheet" href="vendor/videojs/skin.min.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<section id="panel" aria-labelledby="title">
<div class="glass-sheet">
<form id="link-form" novalidate>
<img class="brand-mark" src="icon.svg" alt="TiPlay" width="72" height="72">
<h1 id="title" data-i18n="heading"></h1>
<p class="intro" data-i18n="intro"></p>
<div class="field">
<label for="code" data-i18n="codeLabel"></label>
<input id="code" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
</div>
<div class="field">
<label for="host" data-i18n="hostLabel"></label>
<input id="host" name="host" inputmode="decimal" autocomplete="off" spellcheck="false">
<p class="hint" data-i18n="hostHelp"></p>
</div>
<button id="connect" class="primary" type="submit" data-i18n="connect"></button>
<button id="disconnect" type="button" data-i18n="disconnect" hidden></button>
<p id="message" role="alert"></p>
</form>
<div id="portal-controls">
<p id="status" role="status" aria-live="polite"></p>
<details id="diagnostics">
<summary data-i18n="diagnostics"></summary>
<p class="hint" data-i18n="diagnosticsHelp"></p>
<pre id="connection-details" tabindex="0"></pre>
<button id="stats-toggle" type="button" role="switch" aria-checked="false">
<span data-i18n="stats"></span>
<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
</button>
</details>
<nav>
<button id="fit" class="primary" type="button" data-i18n="fit" hidden></button>
</nav>
</div>
<p class="hint window-help" data-i18n="resizeHelp"></p>
<footer><a id="page-version" href="https://github.com/uJZk/TiPlay/releases"></a></footer>
</div>
</section>
<section id="stage" hidden>
<canvas id="screen"></canvas>
<div id="touch" aria-hidden="true"></div>
</section>
</main>
<!-- The monitor is outside the negotiated video surface and never consumes its layout space. -->
<output id="stats" aria-label="Performance monitor: codec, current FPS, current Delta, dropped frames" hidden></output>
<section id="reconnect" aria-label="TiPlay" hidden>
<img id="reconnect-wallpaper" src="reconnect-wallpaper-blurred.png" alt="" referrerpolicy="no-referrer">
<img id="reconnect-logo" src="icon.svg" alt="TiPlay" width="128" height="128">
<p id="reconnect-message" role="status" aria-live="polite" aria-atomic="true"></p>
<button id="reconnect-settings" type="button" data-i18n="settings"></button>
</section>

<div class="notification-stack">
<aside class="tiplay-notification" id="browser-notice" role="alertdialog" aria-labelledby="browser-notice-heading" aria-describedby="browser-notice-message" hidden>
<div class="airplay-trust-header"><img src="icon.svg" alt="" width="38" height="38"><strong id="browser-notice-heading" data-browser-heading></strong></div>
<p id="browser-notice-message" class="notification-message" data-browser-message></p>
<div class="airplay-trust-actions"><button type="button" data-browser-close></button></div>
</aside>
<aside class="tiplay-notification" id="airplay-trust" role="alertdialog" aria-labelledby="airplay-trust-heading" aria-describedby="airplay-trust-name" hidden>
<div class="airplay-trust-header"><img src="icon.svg" alt="" width="38" height="38"><strong id="airplay-trust-heading" data-trust-heading></strong></div>
<p id="airplay-trust-name" data-trust-name></p>
<div class="airplay-trust-actions"><button type="button" data-trust-reject></button><button type="button" data-trust-allow></button></div>
</aside>
<aside class="tiplay-notification" id="location-notice" role="alertdialog" aria-labelledby="location-notice-heading" aria-describedby="location-notice-message" hidden>
<div class="airplay-trust-header"><img src="icon.svg" alt="" width="38" height="38"><strong id="location-notice-heading" data-location-heading></strong></div>
<p id="location-notice-message" class="notification-message" data-location-message></p>
<div class="airplay-trust-actions"><button type="button" data-location-close></button></div>
</aside>
</div>
<noscript>TiPlay needs JavaScript. · TiPlay 需要 JavaScript。</noscript>
</body>
</html>
