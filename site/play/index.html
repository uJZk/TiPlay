<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121c">
<meta name="referrer" content="no-referrer">
<!-- CSP host sources cannot express IP ranges, so connect-src allows the driver's HTTP phone address. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http:; media-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TiPlay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reconnect.css">
<link rel="stylesheet" href="airplay-controls.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<section id="panel" aria-labelledby="title">
<div class="glass-sheet">
<form id="link-form" novalidate>
<img class="brand-mark" src="icon.svg" alt="TiPlay" width="72" height="72">
<h1 id="title" data-i18n="heading"></h1>
<p class="intro" data-i18n="intro"></p>
<div class="field">
<label for="code" data-i18n="codeLabel"></label>
<input id="code" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
</div>
<div class="field">
<label for="host" data-i18n="hostLabel"></label>
<input id="host" name="host" inputmode="decimal" autocomplete="off" spellcheck="false">
<p class="hint" data-i18n="hostHelp"></p>
</div>
<button id="connect" class="primary" type="submit" data-i18n="connect"></button>
<button id="disconnect" type="button" data-i18n="disconnect" hidden></button>
<p id="message" role="alert"></p>
</form>
<div id="portal-controls">
<p id="status" role="status" aria-live="polite"></p>
<button id="stats-toggle" type="button" role="switch" aria-checked="false">
<span data-i18n="stats"></span>
<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
</button>
<nav>
<button id="fit" class="primary" type="button" data-i18n="fit" hidden></button>
</nav>
</div>
<p class="hint window-help" data-i18n="resizeHelp"></p>
<footer><a href="https://github.com/uJZk/DiPlay" data-i18n="source"></a></footer>
</div>
</section>
<section id="stage" hidden>
<canvas id="screen"></canvas>
<div id="touch" aria-hidden="true"></div>
<div id="audio-controls">
<p id="audio-message" role="status"></p>
</div>
<output id="stats" aria-label="Debug: codec, FPS, presentation statistics; drawn frame source expected time, submission time and offset" hidden></output>
</section>
</main>
<section id="reconnect" aria-label="TiPlay" hidden>
<img id="reconnect-wallpaper" src="reconnect-wallpaper-blurred.png" alt="" referrerpolicy="no-referrer">
<img id="reconnect-logo" src="icon.svg" alt="TiPlay" width="128" height="128">
<p id="reconnect-message" role="status" aria-live="polite" aria-atomic="true"></p>
<button id="reconnect-settings" type="button" data-i18n="settings"></button>
</section>

<noscript>TiPlay needs JavaScript. · TiPlay 需要 JavaScript。</noscript>
</body>
</html>
