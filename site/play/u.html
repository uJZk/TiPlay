<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>TiPlay</title></head>
<body><p id="status">Checking for updates… 正在检查更新…</p>
<script>
(async () => {
  try {
    const registration = await navigator.serviceWorker?.register('./sw.js', { updateViaCache: 'none' });
    if (registration) {
      await registration.update();
      const worker = registration.installing || registration.waiting || registration.active;
      if (worker && worker.state !== 'activated') await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('timeout')), 60000);
        const changed = () => {
          if (worker.state === 'activated' || worker.state === 'redundant') {
            clearTimeout(timer); worker.removeEventListener('statechange', changed);
            worker.state === 'activated' ? resolve() : reject(new Error('update failed'));
          }
        };
        worker.addEventListener('statechange', changed); changed();
      });
    }
    location.replace('./' + location.search + location.hash);
  } catch (_) {
    document.getElementById('status').textContent = 'Update failed. Check the connection and reload this page. 更新失败，请检查网络后刷新此页。';
  }
})();
</script></body></html>
